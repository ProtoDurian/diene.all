services:
  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
  renderer:
    image: grafana/grafana-image-renderer@sha256:a7970b826f6e477461e02bf5463d92634e9ad27d525e4e50296978a2e592d2d7
    environment:
      AUTH_TOKEN: '-'
  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    # must own ./prom-data, or Prometheus exits with "permission denied"
    user: '${SANDBOX_UID:-1000}:${SANDBOX_GID:-1000}'
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./prom-data:/prometheus
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    profiles: [logs]
    # 7h keeps the whole 6-hour history in memory; at the default 2h, queries miss lines older than about 2.5h
    command: [-config.file=/etc/loki/local-config.yaml, -ingester.max-chunk-age=7h, -reporting.enabled=false]
    ports: ['127.0.0.1:3100:3100']
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    profiles: [logs]
    command: [-config.file=/etc/tempo.yaml]
    ports: ['127.0.0.1:3200:3200', '127.0.0.1:4318:4318']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
