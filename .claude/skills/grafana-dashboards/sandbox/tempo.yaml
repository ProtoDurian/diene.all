server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          # 0.0.0.0, not localhost, or the published port gets no traffic
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
