version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  - package-ecosystem: pub
    directory: /packages/diene_auth_engine
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
    open-pull-requests-limit: 2
