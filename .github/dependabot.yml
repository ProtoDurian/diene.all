version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  - package-ecosystem: helm
    directory: /infra/root_chart
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  # ### dotnet-base-dependabot
  # #### source: dotnet-base
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
    open-pull-requests-limit: 2
