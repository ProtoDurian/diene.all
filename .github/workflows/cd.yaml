# ### bun-lib-cd
# #### source: bun-lib
name: CD

on:
  push:
    tags:
      - v*.*.*

jobs:
  publish:
    name: Publish to npm
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-publish.yaml
    secrets: inherit
    with:
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64
