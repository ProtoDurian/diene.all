name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Release
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-release-note.yaml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-workspace
      dockerfile: ./infra/Dockerfile
      version: ${{ github.ref_name }}

  helm:
    name: Helm Chart
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/root_chart
      version: ${{ github.ref_name }}
