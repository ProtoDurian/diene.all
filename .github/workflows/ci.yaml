name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit
    with:
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64

  named-checks:
    name: named-checks
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-named-checks.yaml
    secrets: inherit
    with:
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64

  # ### bun-base-ci
  # #### source: bun-base
  unit:
    name: Unit Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64

  int:
    name: Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: int
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64

  build:
    name: Build Validation
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-build.yaml
    secrets: inherit
    with:
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64
