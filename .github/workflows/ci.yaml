name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  named-checks:
    name: named-checks
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-named-checks.yaml
    secrets: inherit

  analyze:
    name: Static Analysis
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-analyze.yaml
    secrets: inherit

  unit:
    name: Unit and C0 Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit

  meta:
    name: TestHelper Meta Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: meta

  deadcode:
    name: Dead Code
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-deadcode.yaml
    secrets: inherit

  package-validate:
    name: Package Validation
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-package-validate.yaml
    secrets: inherit
