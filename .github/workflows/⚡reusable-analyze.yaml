name: ⚡ Reusable Dart Analyze

on:
  workflow_call:

jobs:
  analyze:
    name: Static Analysis
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Analyze the workspace
        run: nix develop .#ci -c ./scripts/ci/analyze.sh
