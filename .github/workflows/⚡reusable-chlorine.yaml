name: ⚡ Reusable Chlorine

on:
  workflow_call:

jobs:
  unit:
    name: Chlorine Unit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Run the unit tier
        run: nix develop .#ci -c ./scripts/ci/chlorine.sh

  integration:
    name: Chlorine Integration
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Install on k3d, Reloader healthy, Secret change restarts an annotated Deployment
        run: nix develop .#ci -c ./scripts/ci/chlorine-k3d.sh
