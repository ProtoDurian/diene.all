name: ⚡ Reusable Cobalt

on:
  workflow_call:

jobs:
  unit:
    name: Cobalt Unit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Run the unit tier
        run: nix develop .#ci -c ./scripts/ci/cobalt.sh

  integration:
    name: Cobalt Integration
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Install on k3d, ESO healthy, store applied
        run: nix develop .#ci -c ./scripts/ci/cobalt-k3d.sh
