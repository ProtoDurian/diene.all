# ### dotnet-base-reusable-deadcode
# #### source: dotnet-base
name: ⚡ Reusable Dead Code

on:
  workflow_call:

jobs:
  deadcode:
    name: Dead Code
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'true'
      - uses: AtomiCloud/actions.cache-nuget@v2
      - name: Run strict dead-code inspection
        run: nix develop .#ci -c ./scripts/ci/dead-code.sh
