name: ⚡ Reusable Helm Wrapper

on:
  workflow_call:

jobs:
  validate:
    name: Validate Helm Wrapper
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Run wrapper validation
        run: nix develop .#ci -c ./scripts/ci/helm-wrapper.sh

  install:
    name: Install Helm Wrapper
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Install on k3s and round-trip the chart over OCI
        run: nix develop .#ci -c ./scripts/ci/helm-wrapper-k3d.sh
