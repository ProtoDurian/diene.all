name: ⚡ Reusable Infra Validation

on:
  workflow_call:

jobs:
  infra:
    name: Infra Validation
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-bun@v2
      - name: Validate OpenTofu, sealed secrets and the wrangler contract
        run: nix develop .#ci -c ./scripts/ci/infra.sh
