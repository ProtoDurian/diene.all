name: ⚡ Reusable Named Checks

on:
  workflow_call:

jobs:
  named-checks:
    name: named-checks
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-40gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v4
      - name: Run named checks
        run: durian-shell .#ci -c ./scripts/ci/named-checks.sh
