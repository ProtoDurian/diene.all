name: ⚡ Reusable Named Checks

on:
  workflow_call:

jobs:
  named-checks:
    name: named-checks
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'true'
      - name: Run named checks
        run: nix develop .#ci -c ./scripts/ci/named-checks.sh
