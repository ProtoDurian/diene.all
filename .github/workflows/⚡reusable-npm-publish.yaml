name: ⚡ Reusable npm-publish

on:
  workflow_call:
    secrets:
      NPM_API_KEY:
        required: true

jobs:
  npm-publish:
    name: npm-publish
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-bun@v2
      - name: Publish library
        env:
          NPM_API_KEY: ${{ secrets.NPM_API_KEY }}
        run: nix develop .#cd -c ./scripts/ci/publish.sh
