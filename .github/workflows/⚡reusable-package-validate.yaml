name: ⚡ Reusable Package Validate

on:
  workflow_call:

jobs:
  package-validate:
    name: Package Validation
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-nuget@v2
      - name: Validate NuGet packages
        run: nix develop .#ci -c ./scripts/ci/pkg-validate.sh
