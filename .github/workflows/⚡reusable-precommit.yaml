name: ⚡ Reusable Pre-Commit

on:
  workflow_call:

jobs:
  precommit:
    name: Pre-Commit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh
