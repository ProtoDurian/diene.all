name: ⚡ Reusable Publish

on:
  workflow_call:

jobs:
  publish:
    name: Verify Go proxy publication
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-go@v2
      - name: Verify the tagged module through the proxy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: nix develop .#cd -c ./scripts/ci/publish.sh "${RELEASE_TAG}"
