name: ⚡ Reusable Publish

on:
  workflow_call:
    secrets:
      NUGET_API_KEY:
        required: true

jobs:
  publish:
    name: Publish to NuGet
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-nuget@v2
      - name: Publish library packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: nix develop .#cd -c ./scripts/ci/publish.sh
