name: ⚡ Reusable Release Note

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  release-note:
    name: Release Note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Release note
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/ci/release-note.sh
