name: ⚡ Reusable Sulfur

on:
  workflow_call:

jobs:
  unit:
    name: Sulfur Unit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Run the unit tier
        run: nix develop .#ci -c ./scripts/ci/sulfur.sh

  integration:
    name: Sulfur Integration
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Install on k3d, cert-manager healthy, self-signed Certificate Ready
        run: nix develop .#ci -c ./scripts/ci/sulfur-k3d.sh
