# ### dotnet-base-reusable-test
# #### source: dotnet-base
name: ⚡ Reusable Test

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'true'
      - uses: AtomiCloud/actions.cache-nuget@v2
      - uses: AtomiCloud/actions.setup-docker@v2
      - name: Run ${{ inputs.mode }} coverage
        env:
          MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "${MODE}"
      - name: Upload ${{ inputs.mode }} test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ inputs.mode }}
          path: TestResults/${{ inputs.mode }}/*.trx
          if-no-files-found: warn
      - name: Upload ${{ inputs.mode }} coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ inputs.mode }}
          path: TestResults/${{ inputs.mode }}/coverage/coverage.cobertura.xml
          if-no-files-found: warn
      - name: Upload ${{ inputs.mode }} coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: TestResults/${{ inputs.mode }}/coverage/coverage.cobertura.xml
          flags: ${{ inputs.mode }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
