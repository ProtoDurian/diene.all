name: ⚡ Reusable Test

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-nuget@v2
      - uses: AtomiCloud/actions.setup-docker@v2
      - name: Run ${{ inputs.mode }} coverage
        env:
          MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "${MODE}"
      - name: Upload ${{ inputs.mode }} test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.mode }}
          path: TestResults/${{ inputs.mode }}/*.trx
          if-no-files-found: warn
      - name: Upload ${{ inputs.mode }} coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: reports/
          if-no-files-found: warn
