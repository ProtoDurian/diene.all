version: '2'

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - noctx
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - staticcheck
    - testpackage
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: exported
          disabled: true
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: package-comments
          disabled: true
    testpackage:
      # export_test.go and package main get no white-box exemption
      allow-packages: [none]
      skip-regexp: ^$
  exclusions:
    generated: lax
    rules:
      - path: api/v1alpha1/
        linters: [revive]
        text: 'struct-tag: unknown option "inline"'
      - path: cmd/manager/
        linters: [revive]
        text: deep-exit
      - path: _test\.go
        linters: [revive]
        text: redundant-test-main-exit
      - path: _test\.go
        linters: [unparam]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
