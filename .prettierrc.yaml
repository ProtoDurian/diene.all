arrowParens: avoid
bracketSpacing: true
printWidth: 120
semi: true
singleAttributePerLine: false
singleQuote: true
tabWidth: 2
trailingComma: all
# The probe files the nix layer (main) owns keep main's format (prettier defaults) so
# workspace inherits them byte-identical or append-only (rules/PROBES.md §5).
overrides:
  - files:
      - probes/binary-smoke.ts
      - probes/dev-shell.ts
      - probes/direnv.ts
      - probes/precommit-treefmt-actionlint.ts
      - probes/precommit-treefmt-nixfmt.ts
      - probes/precommit-treefmt-prettier.ts
      - probes/precommit-treefmt-shfmt.ts
    options:
      arrowParens: always
      printWidth: 80
      singleQuote: false
