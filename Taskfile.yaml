version: '3'

includes:
  test:unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  test:int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
  test:meta:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: meta

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - rm -rf dist coverage reports node_modules

  build:
    desc: Build the publishable library (ESM + CJS + types) to dist/
    cmds:
      - ./scripts/local/build.sh

  deadcode:
    desc: Review dead code with the LLM Knip views
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration, and meta suites without coverage
    cmds:
      - task: test:unit
      - task: test:int
      - task: test:meta

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - task: test:unit:coverage
      - task: test:int:coverage

  run:
    desc: Run the Bun source entry point
    cmds:
      - bun run ./src/index.ts -- {{.CLI_ARGS}}

  preview:
    desc: Build and run the bundled Bun artifact
    deps: [build]
    cmds:
      - bun run ./dist/index.js -- {{.CLI_ARGS}}
