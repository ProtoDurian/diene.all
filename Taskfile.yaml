version: '3'

includes:
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
      CONFIG: bunfig.unit.toml
  int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
      CONFIG: bunfig.int.toml
      TIMEOUT: 120000
  e2e:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: e2e
      CONFIG: bunfig.e2e.toml
      TIMEOUT: 240000

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - rm -rf dist coverage
      - '[ -d node_modules ] && find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'

  build:
    desc: Build the web app to dist/web and the Worker bundle to dist/worker
    cmds:
      - ./scripts/local/build.sh

  compile:
    desc: Compile the aseity CLI for this host into dist/bin/
    cmds:
      - ./scripts/release/compile.sh

  release:snapshot:
    desc: Package every CLI channel locally without publishing
    cmds:
      - ./scripts/release/publish.sh --snapshot

  secrets:init:
    desc: Seal secrets/ to your own age key (creates the key if missing)
    cmds:
      - ./scripts/local/secrets-init.sh

  infra:validate:
    desc: Validate OpenTofu, sealed secrets and the wrangler contract
    cmds:
      - ./scripts/ci/infra.sh

  deadcode:
    desc: Review dead code with the LLM Knip views
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration and e2e suites without coverage
    cmds:
      - task: unit:default
      - task: int:default
      - task: e2e:default

  test:unit:
    desc: Run the unit suite without coverage
    cmds:
      - task: unit:default

  test:int:
    desc: Run the integration suite without coverage
    cmds:
      - task: int:default

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - task: unit:coverage
      - task: int:coverage
      - task: e2e:coverage

  test:unit:coverage:
    desc: Run the unit suite with coverage
    cmds:
      - task: unit:coverage

  test:e2e:
    desc: Run the e2e suite (local workerd, CLI binary) without coverage
    cmds:
      - task: e2e:default

  test:e2e:coverage:
    desc: Run the e2e suite with its ledger
    cmds:
      - task: e2e:coverage

  test:int:coverage:
    desc: Run the integration suite with coverage
    cmds:
      - task: int:coverage

  test:watch:
    desc: Watch the fast unit suite
    cmds:
      - task: unit:watch

  run:
    desc: Run the aseity CLI from source
    cmds:
      - bun run ./cli/index.ts {{.CLI_ARGS}}

  preview:
    desc: Compile the aseity CLI and run the binary
    deps: [compile]
    cmds:
      - ./dist/bin/aseity {{.CLI_ARGS}}

  dev:
    desc: Start the local Postgres and MinIO stack, then the Worker on local workerd
    cmds:
      - docker compose -f compose.dev.yaml up -d --wait
      - ./node_modules/.bin/vite build --config web/vite.config.ts
      - wrangler dev

  down:
    desc: Stop the local Postgres and MinIO stack
    cmds:
      - docker compose -f compose.dev.yaml down
