version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  pichu:opal:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: platinum
      NAMESPACE: sulfoxide
      LANDSCAPE: pichu
      CLUSTER: opal

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  build:
    desc: Build the pinned chart dependencies
    cmds:
      - helm dependency build chart

  update:
    desc: Refresh the pinned upstream chart dependency
    cmds:
      - helm dependency update chart

  latest:
    desc: Resolve the latest real upstream chart and image tags
    cmds:
      - ./scripts/local/latest-chart-upstreams.sh

  test:unit:
    desc: Run schema, lint, render, policy, and contract validation
    cmds:
      - ./scripts/ci/platinum.sh

  test:int:
    desc: Run the k3d integration tier
    cmds:
      - ./scripts/ci/platinum-k3d.sh

  test:entei:
    desc: Run the k3d ENTEI dev-host fixture tier
    cmds:
      - ./scripts/ci/platinum-entei.sh

  start:cluster:
    desc: Start the local k3d proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
