version: '3'

vars:
  ARTIFACT_PREFIX:
    sh: jq -r '.bin | to_entries[0].key' package.json
  ARTIFACT: '{{.ARTIFACT_PREFIX}}-{{OS}}-{{if eq ARCH "arm64"}}arm64{{else}}x64-baseline{{end}}'
  ENTRY:
    sh: jq -r '.bin | to_entries[0].value' package.json

includes:
  compile: tasks/Taskfile.compile.yaml
  docker: tasks/Taskfile.docker.yaml
  test:unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  test:int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
  test:meta:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: meta

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - rm -rf dist prebuilt coverage reports node_modules

  build:
    desc: Build the Bun bundle to dist/
    cmds:
      - ./scripts/local/build.sh

  deadcode:
    desc: Review dead code with the LLM Knip views
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration, meta, and SIT suites without coverage
    cmds:
      - task: test:unit
      - task: test:int
      - task: test:meta
      - task: test:sit

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - task: test:unit:coverage
      - task: test:int:coverage
      - task: test:sit:coverage

  test:sit:
    desc: Run the SIT tier through the freshly compiled binary
    deps: [compile]
    cmds:
      - SIT_DRIVER=binary CLI_BIN=dist/bin/{{.ARTIFACT}} ./scripts/local/test.sh sit {{.CLI_ARGS}}

  test:sit:coverage:
    desc: Run SIT journeys in-process and emit the full-system ledger
    cmds:
      - rm -rf reports/e2e
      - SIT_DRIVER=inprocess ./scripts/local/test.sh sit --coverage
      - test -f reports/e2e/lcov.info

  run:
    desc: Run the CLI source entry point
    cmds:
      - bun run {{.ENTRY}} -- {{.CLI_ARGS}}

  preview:
    desc: Run this host's compiled standalone binary
    deps: [compile]
    cmds:
      - ./dist/bin/{{.ARTIFACT}} {{.CLI_ARGS}}

  up:
    desc: Start the sample Redis dependency in the background
    cmds:
      - docker run -d --rm --name {{.ARTIFACT_PREFIX}}-redis -p 6379:6379 redis:7.4.5-alpine

  down:
    desc: Stop the sample Redis dependency
    cmds:
      - docker rm -f {{.ARTIFACT_PREFIX}}-redis
