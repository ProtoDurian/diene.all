version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  example:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: certs
      LANDSCAPE: example
  pikachu:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: certs
      LANDSCAPE: pikachu
  raichu:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: certs
      LANDSCAPE: raichu
  ampharos:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: certs
      LANDSCAPE: ampharos
  pichu:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: certs
      LANDSCAPE: pichu
  entei:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: certs
      LANDSCAPE: entei

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  test:unit:
    desc: Run schema, lint, render, policy, and contract validation
    cmds:
      - ./scripts/ci/zinc.sh

  test:int:
    desc: Run the local k3d installation proof
    cmds:
      - ./scripts/ci/zinc-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
