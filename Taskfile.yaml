version: '3'

includes:
  docker: tasks/Taskfile.docker.yaml
  test: tasks/Taskfile.test.yaml

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - ./scripts/local/clean.sh

  build:
    desc: Build the Bun bundle to dist/
    cmds:
      - ./scripts/local/build.sh

  deadcode:
    desc: Review dead code with the LLM Knip views
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration, and meta suites without coverage
    cmds:
      - task: test:unit
      - task: test:int
      - task: test:meta

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - ./scripts/local/test.sh unit --coverage
      - ./scripts/local/test.sh int --coverage

  test:unit:coverage:
    desc: Run the unit suite with coverage
    cmds:
      - ./scripts/local/test.sh unit --coverage

  test:int:coverage:
    desc: Run the integration suite with coverage
    cmds:
      - ./scripts/local/test.sh int --coverage

  test:watch:
    desc: Watch the fast unit suite
    cmds:
      - ./scripts/local/test.sh unit --watch

  run:
    desc: Run the Bun source entry point
    cmds:
      - bun run ./src/index.ts -- {{.CLI_ARGS}}

  preview:
    desc: Build and run the bundled Bun artifact
    deps: [build]
    cmds:
      - bun run ./dist/index.js -- {{.CLI_ARGS}}
