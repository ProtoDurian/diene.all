version: '3'

includes:
  docker: tasks/Taskfile.docker.yaml
  helm: tasks/Taskfile.helm.yaml
  test:unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  test:int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
  test:sit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: sit
  operator: tasks/Taskfile.operator.yaml

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
  clean:
    desc: Remove Go build, coverage and report outputs
    cmds:
      - rm -rf dist coverage reports

  build:
    desc: Build the Go binary
    cmds:
      - ./scripts/local/build.sh

  typecheck:
    desc: Typecheck Go source packages
    cmds:
      - ./scripts/local/typecheck.sh

  run:
    desc: Run the manager composition root from source
    cmds:
      - go run ./cmd/manager {{.CLI_ARGS}}

  preview:
    desc: Build and run the compiled manager artifact
    deps: [build]
    cmds:
      - ./dist/manager {{.CLI_ARGS}}

  up:
    desc: Start the local MinIO ledger, detached
    cmds:
      - docker run -d --rm --name operator-template-ledger -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:RELEASE.2024-01-16T16-07-38Z server /data

  down:
    desc: Stop the local MinIO ledger
    cmds:
      - docker stop operator-template-ledger 2>/dev/null || true

  deadcode:
    desc: Emit the non-blocking LLM dead-code review
    cmds:
      - ./scripts/local/deadcode.sh lax

  deadcode:strict:
    desc: Run the four blocking dead-code passes
    cmds:
      - ./scripts/local/deadcode.sh strict

  test:
    desc: Run unit, integration and system integration tests
    cmds:
      - task: test:unit
      - task: test:int
      - task: build
      - task: test:sit

  test:coverage:
    desc: Run the unit and integration tiers with their coverage gates
    cmds:
      - task: test:unit:coverage
      - task: test:int:coverage

  vuln:
    desc: Scan Go dependencies for known vulnerabilities
    cmds:
      - ./scripts/local/vuln.sh
