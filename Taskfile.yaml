version: '3'

includes:
  test:unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  test:int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
  test:meta:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: meta

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
  clean:
    desc: Remove Go build, coverage and report outputs
    cmds:
      - rm -rf dist coverage reports

  build:
    desc: Build every package of the Go module
    cmds:
      - ./scripts/local/build.sh

  typecheck:
    desc: Typecheck Go source packages
    cmds:
      - ./scripts/local/typecheck.sh

  validate:
    desc: Run the library gates (module path, vet, API compatibility, export docs, examples)
    cmds:
      - ./scripts/ci/pkg-validate.sh

  up:
    desc: Start all local dependencies, detached
    cmds:
      - ./scripts/local/up.sh

  down:
    desc: Stop all local dependencies
    cmds:
      - ./scripts/local/down.sh

  deadcode:
    desc: Emit the non-blocking LLM dead-code review
    cmds:
      - ./scripts/local/deadcode.sh lax

  deadcode:strict:
    desc: Run the four blocking dead-code passes
    cmds:
      - ./scripts/local/deadcode.sh strict

  test:
    desc: Run unit, integration and TestHelper meta tests
    cmds:
      - task: test:unit
      - task: test:int
      - task: test:meta

  test:coverage:
    desc: Run the unit, integration and meta tiers with their coverage gates
    cmds:
      - task: test:unit:coverage
      - task: test:int:coverage
      - task: test:meta:coverage

  vuln:
    desc: Scan Go dependencies for known vulnerabilities
    cmds:
      - ./scripts/local/vuln.sh
