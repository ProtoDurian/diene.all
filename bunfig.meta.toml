[test]
root = "tests/meta"
coverageReporter = ["text", "lcov"]
coverageDir = "reports/meta"
coverageSkipTestFiles = true
# Meta ledger = TestHelper code only; all current non-helper source tiers and tests never count.
coveragePathIgnorePatterns = ["src/adapters/**", "src/index.ts", "src/lib/**", "tests/**"]

# Imports every src/test-helper module so an untested one is measured at 0% rather than absent.
preload = ["./tests/support/meta-ledger.ts"]

# Scalar only (Bun 1.3.13 ignores the per-metric object); 0.98 because Bun counts one function no source line maps to.
coverageThreshold = 0.98
