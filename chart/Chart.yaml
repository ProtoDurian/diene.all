apiVersion: v2
name: platinum
description: AtomiCloud Gateway API ingress chart wrapping kgateway (element platinum)
type: application
version: 0.1.0
appVersion: 'v2.5.0'
kubeVersion: '>=1.33.0-0'
dependencies:
  - name: kgateway
    alias: upstream
    version: v2.5.0
    repository: oci://cr.kgateway.dev/kgateway-dev/charts
    condition: upstream.enabled
  - name: kgateway-crds
    alias: crds
    version: v2.5.0
    repository: oci://cr.kgateway.dev/kgateway-dev/charts
    condition: crds.enabled
