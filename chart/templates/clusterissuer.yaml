{{- include "zinc.validateServiceTree" . -}}
{{- include "zinc.validateIssuer" . -}}
{{- $root := . -}}
{{- $issuer := .Values.issuer -}}
{{- $tokenKey := printf "%s%s" (include "zinc.secretPrefix" .Values.secret.serviceFolder) (required "issuer.cloudflareTokenKey is required" $issuer.cloudflareTokenKey) -}}
{{- range $ref := $issuer.refs }}
{{- $name := include "zinc.resourceName" (dict "root" $root "token" $ref.token) }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  labels:
    {{- include "zinc.labels" $root | nindent 4 }}
  annotations:
    {{- include "zinc.annotations" $root | nindent 4 }}
spec:
  acme:
    server: {{ index $issuer.directories $ref.directory | quote }}
    email: {{ required "issuer.email is required" $issuer.email | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account" $name }}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ include "zinc.secretName" $root }}
              key: {{ $tokenKey }}
        {{- with $issuer.dnsZones }}
        selector:
          dnsZones:
            {{- toYaml . | nindent 12 }}
        {{- end }}
{{- end }}
