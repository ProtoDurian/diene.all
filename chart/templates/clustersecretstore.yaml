{{- include "cobalt.validateServiceTree" . -}}
{{- include "cobalt.validateUpstreamLabels" . -}}
{{- $creds := .Values.store.credentials -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ required "store.name is required" .Values.store.name }}
  labels:
    {{- include "cobalt.labels" . | nindent 4 }}
  annotations:
    {{- include "cobalt.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    infisical:
      hostAPI: {{ required "store.hostAPI is required" .Values.store.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ required "store.credentials.secretName is required" $creds.secretName | quote }}
            namespace: {{ required "store.credentials.namespace is required" $creds.namespace | quote }}
            key: {{ required "store.credentials.clientIdKey is required" $creds.clientIdKey | quote }}
          clientSecret:
            name: {{ $creds.secretName | quote }}
            namespace: {{ $creds.namespace | quote }}
            key: {{ required "store.credentials.clientSecretKey is required" $creds.clientSecretKey | quote }}
      secretsScope:
        projectSlug: {{ required "store.project is required" .Values.store.project | quote }}
        environmentSlug: {{ .Values.serviceTree.landscape | quote }}
        secretsPath: /
        recursive: true
