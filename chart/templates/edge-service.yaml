{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platinum.resourceName" (dict "root" . "token" "edge") }}
  labels:
    {{- include "platinum.labels" . | nindent 4 }}
  annotations:
    {{- include "platinum.annotations" . | nindent 4 }}
    {{- if eq .Values.gateway.provider "aws" }}
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ join "," .Values.gateway.aws.subnetIds | quote }}
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: {{ join "," .Values.gateway.aws.eipAllocationIds | quote }}
    {{- else if eq .Values.gateway.provider "oci" }}
    oci.oraclecloud.com/load-balancer-type: nlb
    oci.oraclecloud.com/reserved-ips: {{ .Values.gateway.oci.reservedPublicIp | quote }}
    {{- else if eq .Values.gateway.provider "digitalocean" }}
    service.beta.kubernetes.io/do-loadbalancer-name: {{ printf "%s-%s" (include "platinum.resourceName" (dict "root" . "token" "edge")) (default "local" .Values.serviceTree.cluster) | quote }}
    {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    gateway.networking.k8s.io/gateway-name: {{ include "platinum.gatewayName" . }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
      protocol: TCP
    - name: https
      port: {{ .Values.gateway.tlsPort }}
      targetPort: {{ .Values.gateway.tlsPort }}
      protocol: TCP
{{- end }}
