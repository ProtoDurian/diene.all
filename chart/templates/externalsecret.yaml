{{- if .Values.secret.enabled -}}
{{- include "aluminium.validateServiceTree" . -}}
{{- $shared := include "aluminium.secretPrefix" .Values.secret.sharedFolder -}}
{{- $service := include "aluminium.secretPrefix" .Values.secret.serviceFolder -}}
{{- if or (hasPrefix $shared $service) (hasPrefix $service $shared) -}}
{{- fail (printf "secret key prefixes %q (%s) and %q (%s) collide" $shared .Values.secret.sharedFolder $service .Values.secret.serviceFolder) -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "aluminium.resourceName" (dict "root" . "token" "secrets") }}
  labels:
    {{- include "aluminium.labels" . | nindent 4 }}
  annotations:
    {{- include "aluminium.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ include "aluminium.resourceName" (dict "root" . "token" "secrets") }}
    creationPolicy: Owner
  dataFrom:
    - find:
        path: {{ .Values.secret.sharedFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ $shared }}$1'
    - find:
        path: {{ .Values.secret.serviceFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ $service }}$1'
{{- end }}
