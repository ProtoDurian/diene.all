{{- include "zinc.validateServiceTree" . -}}
{{- $shared := include "zinc.secretPrefix" .Values.secret.sharedFolder -}}
{{- $service := include "zinc.secretPrefix" .Values.secret.serviceFolder -}}
{{- if or (hasPrefix $shared $service) (hasPrefix $service $shared) -}}
{{- fail (printf "secret key prefixes %q (%s) and %q (%s) collide" $shared .Values.secret.sharedFolder $service .Values.secret.serviceFolder) -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "zinc.secretName" . }}
  labels:
    {{- include "zinc.labels" . | nindent 4 }}
  annotations:
    {{- include "zinc.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ include "zinc.secretName" . }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "zinc.labels" . | nindent 10 }}
        annotations:
          {{- include "zinc.annotations" . | nindent 10 }}
  dataFrom:
    - find:
        path: {{ .Values.secret.sharedFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ $shared }}$1'
    - find:
        path: {{ .Values.secret.serviceFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ $service }}$1'
