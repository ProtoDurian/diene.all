{{- if .Values.gateway.enabled -}}
{{- $name := include "platinum.resourceName" (dict "root" . "token" "healthz") -}}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: DirectResponse
metadata:
  name: {{ $name }}
  {{- include "platinum.metadata" . | nindent 2 }}
spec:
  status: {{ .Values.gateway.health.status }}
  body: ok
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  {{- include "platinum.metadata" . | nindent 2 }}
spec:
  parentRefs:
    - name: {{ include "platinum.gatewayName" . }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .Values.gateway.health.path }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.kgateway.dev
            kind: DirectResponse
            name: {{ $name }}
{{- end }}
