serviceTree:
  cluster: lapras

# The k3d emulated stack is unauthenticated and has no ExternalSecret CRD.
secret:
  enabled: false

upstream:
  cluster:
    name: lapras
  destinations:
    victoriametrics: { auth: { type: none }, secret: { embed: true } }
    gigapipe: { auth: { type: none }, secret: { embed: true } }
  collectorCommon:
    alloy:
      labels: &lpsm
        atomi.cloud/cluster: lapras
      controller:
        podLabels: *lpsm
