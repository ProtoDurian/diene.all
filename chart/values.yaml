# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label and annotation.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: telemetry
  # @schema pattern:^[a-z0-9]+$;required:true
  service: aluminium
  # @schema pattern:^[a-z0-9]+$;required:true
  module: telemetry
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# -- One service-scoped ExternalSecret with folder-prefix rewrites; the only path for backend credentials.
secret:
  enabled: true
  refreshInterval: 1h
  store:
    kind: SecretStore # @schema enum:[SecretStore, ClusterSecretStore]
    name: platform-store
  sharedFolder: /shared
  serviceFolder: /aluminium

# @schema additionalProperties:true
# -- grafana/k8s-monitoring values: two collectors, OTLP destinations (endpoints only), feature assignment.
upstream:
  cluster:
    name: local

  destinations:
    victoriametrics:
      type: otlp
      protocol: http
      url: http://victoriametrics.telemetry.svc:8428/opentelemetry
      metrics: { enabled: true }
      logs: { enabled: false }
      traces: { enabled: false }
      auth: { type: bearerToken, bearerTokenKey: ALUMINIUM_VICTORIAMETRICS_TOKEN }
      secret: { create: false, name: aluminium-secrets }
    gigapipe:
      type: otlp
      protocol: http
      url: http://gigapipe.telemetry.svc:3100
      metrics: { enabled: false }
      logs: { enabled: true }
      traces: { enabled: true }
      auth: { type: basic, usernameKey: ALUMINIUM_GIGAPIPE_USERNAME, passwordKey: ALUMINIUM_GIGAPIPE_PASSWORD }
      secret: { create: false, name: aluminium-secrets }

  applicationObservability:
    enabled: true
    collector: alloy-metrics
    destinations: [victoriametrics, gigapipe]
    receivers:
      otlp:
        grpc: { enabled: false }
        http: { enabled: true, port: 4318 }

  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    destinations: [victoriametrics]

  podLogsViaOpenTelemetry:
    enabled: true
    collector: alloy-logs
    destinations: [gigapipe]

  selfReporting:
    enabled: false

  telemetryServices:
    kube-state-metrics:
      deploy: true
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 128Mi }
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
    node-exporter:
      deploy: true
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }

  alloy-operator:
    deploy: true
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
    # Its hook Jobs expose no pod securityContext, so they cannot meet the workload VAP.
    waitForAlloyRemoval:
      enabled: false

  collectorCommon:
    alloy:
      # The alloy chart reads the pod securityContext only from global.
      global:
        podSecurityContext: { runAsNonRoot: true }
      labels: &lpsm
        atomi.cloud/platform: telemetry
        atomi.cloud/service: aluminium
        atomi.cloud/module: telemetry
        atomi.cloud/layer: '1'
      alloy:
        securityContext:
          runAsNonRoot: true
          runAsUser: 473
          readOnlyRootFilesystem: true
        # Alloy writes its WAL to storagePath; the root filesystem is read-only.
        mounts:
          extra: [{ name: storage, mountPath: /tmp/alloy }]
      configReloader:
        resources:
          requests: { cpu: 10m, memory: 50Mi }
          limits: { cpu: 50m, memory: 64Mi }
      controller:
        podLabels: *lpsm
        volumes:
          extra: [{ name: storage, emptyDir: {} }]

  collectors:
    alloy-metrics:
      presets: [statefulset, clustered]
      alloy:
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
    alloy-logs:
      presets: [daemonset]
      global:
        podSecurityContext: { runAsNonRoot: false, runAsUser: 0 }
      alloy:
        stabilityLevel: public-preview
        # Reading /var/log/pods needs root; the scoped VAP allowance is pending charts/vap-policies.
        securityContext: { runAsNonRoot: false, runAsUser: 0 }
        mounts: { varlog: true }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
