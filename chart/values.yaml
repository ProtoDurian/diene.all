# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label, annotation and policy key.
labelPrefix: atomi.cloud

# @schema pattern:^[a-z0-9]+-[a-z0-9]+$;required:true
# -- Release fullname. It must be `<service>-<module>`.
fullnameOverride: vanadium-policies

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: admission
  # @schema pattern:^[a-z0-9]+$;required:true
  service: vanadium
  # @schema pattern:^[a-z0-9]+$;required:true
  module: policies
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# @schema enum:[audit, deny];required:true
# -- Landscape posture. `audit` binds every policy `[Warn, Audit]` (nothing blocked); `deny` binds `[Deny]`.
enforcement: audit

# @schema pattern:^[a-z0-9-]+$;minLength:1;required:true
# -- Namespaces labeled `<labelPrefix>/<exemptionLabel>: "true"` are skipped by every binding.
exemptionLabel: policy-exempt

# -- One ValidatingAdmissionPolicy + binding per enabled policy. A non-empty `actions` overrides the landscape posture for that policy.
policies:
  requireLabels:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  requireAnnotations:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  landscapeMatch:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  layerRange:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
    # @schema item:string;minItems:1;uniqueItems:true
    # -- Accepted `<labelPrefix>/layer` values.
    layers: ['0', '1', '2']
  platformAccepted:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
    # @schema item:string;minItems:1;uniqueItems:true
    # -- Accepted `<labelPrefix>/platform` values.
    platforms: [admission, telemetry, sample]
  disallowLatest:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  requireResources:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowNodePort:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  requireNonRoot:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowPrivEscalation:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowHostProcess:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowHostNamespaces:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowPrivileged:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowCapabilities:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowHostPorts:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  restrictAppArmor:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  restrictSELinux:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  disallowProcMount:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  restrictSeccomp:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  restrictSysctls:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
  restrictVolumeTypes:
    enabled: true
    # @schema item:string;itemEnum:[Warn, Audit, Deny];uniqueItems:true;maxItems:2
    actions: []
    # -- The one hostPath allowance: these exact paths, for this ServiceAccount in this namespace (alloy-logs). Empty `serviceAccount` disables it.
    hostPathCarveOut:
      # @schema pattern:^([a-z0-9]([-a-z0-9.]*[a-z0-9])?)?$
      serviceAccount: aluminium-alloy-logs
      # @schema pattern:^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      namespace: telemetry
      # @schema item:string;uniqueItems:true
      paths: [/var/log]
