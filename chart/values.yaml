# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: certs
  # @schema pattern:^[a-z0-9]+$;required:true
  service: sulfur
  # @schema pattern:^[a-z0-9]+$;required:true
  module: certs
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# -- cert-manager v1.20.3 values: upstream defaults plus CRDs, Gateway API, LPSM labels, Reloader, container non-root and limits.
# No Issuer/ClusterIssuer (zinc owns the issuer set). CRDs are plain templates (no skipCrds, no SSA: each is under the
# client-side apply annotation limit) and are kept on uninstall.
upstream:
  nameOverride: cert-manager
  crds:
    enabled: true
    keep: true
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  global:
    commonLabels:
      atomi.cloud/platform: certs
      atomi.cloud/service: sulfur
      atomi.cloud/module: certs
      atomi.cloud/layer: '1'
  deploymentAnnotations:
    reloader.stakater.com/auto: 'true'
  containerSecurityContext:
    runAsNonRoot: true
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  webhook:
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'
    containerSecurityContext:
      runAsNonRoot: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 250m, memory: 128Mi }
  cainjector:
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'
    containerSecurityContext:
      runAsNonRoot: true
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
  startupapicheck:
    containerSecurityContext:
      runAsNonRoot: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }
