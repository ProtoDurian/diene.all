# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label and annotation helper.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape is added by the landscape overlays.
serviceTree:
  # @schema enum:[certs];required:true
  # -- cert-manager reads DNS-01 secrets from its cluster resource namespace: sulfur's `certs`.
  platform: certs
  # @schema pattern:^[a-z0-9]+$;required:true
  service: zinc
  # @schema pattern:^[a-z0-9]+$;required:true
  module: issuer
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# -- The one ExternalSecret: the Cloudflare API token from the platform SecretStore (carbon), folder-prefixed.
secret:
  refreshInterval: 1h # @schema pattern:^[0-9]+(s|m|h)$
  store:
    kind: SecretStore # @schema enum:[SecretStore, ClusterSecretStore]
    # -- Platform SecretStore name; carbon has not pinned it yet.
    name: certs # @schema pattern:^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
  sharedFolder: /shared # @schema pattern:^/.+
  serviceFolder: /zinc # @schema pattern:^/.+

# -- The one reusable Let's Encrypt DNS-01 (Cloudflare) ClusterIssuer definition. Overlays only pick refs and zones.
issuer:
  email: platform@atomi.cloud # @schema pattern:^[^@\s]+@[^@\s]+$
  directories:
    production: https://acme-v02.api.letsencrypt.org/directory
    staging: https://acme-staging-v02.api.letsencrypt.org/directory
  # -- Token key under `secret.serviceFolder`; the ExternalSecret adds the folder prefix.
  cloudflareTokenKey: CLOUDFLARE_API_TOKEN # @schema pattern:^[A-Z0-9_]+$
  # @schema item:string;uniqueItems:true
  # -- DNS-01 solver zone restriction. Empty means any zone the token can edit.
  dnsZones: []
  # -- ClusterIssuers to materialize, each named `zinc-<token>`. Registered rows keep `zinc-letsencrypt`.
  refs: # @schema minItems:1
    - token: letsencrypt # @schema pattern:^[a-z0-9]+$;required:true
      directory: staging # @schema enum:[production, staging];required:true
