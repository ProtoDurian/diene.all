# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label and annotation helper.
labelPrefix: atomi.cloud

# @schema pattern:^[a-z0-9]+-[a-z0-9]+$;required:true
# -- Primary workload fullname (`<service>-<module>`): the kgateway control plane.
fullnameOverride: platinum-gateway

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: sulfoxide
  # @schema pattern:^[a-z0-9]+$;required:true
  service: platinum
  # @schema pattern:^[a-z0-9]+$;required:true
  module: gateway
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# -- Shared Gateway API edge: GatewayClass, one shared Gateway, the provider LoadBalancer, and the health route.
gateway:
  enabled: true
  # @schema pattern:^[a-z0-9-]+$
  # -- GatewayClass name platinum owns.
  className: platinum
  # @schema enum:[kgateway.dev/kgateway]
  # -- kgateway's controller name.
  controllerName: kgateway.dev/kgateway
  provider: digitalocean # @schema enum:[aws, oci, digitalocean, local]
  port: 80 # @schema minimum:1;maximum:65535
  tlsPort: 443 # @schema minimum:1;maximum:65535
  aws:
    subnetIds: [] # @schema item:string;uniqueItems:true
    eipAllocationIds: [] # @schema item:string;uniqueItems:true
  oci:
    reservedPublicIp: ''
  health:
    # @schema pattern:^/.*
    # -- Fixed path the traffic controller polls once per cluster per tick.
    path: /healthz
    status: 200 # @schema minimum:200;maximum:299

# -- ENTEI dev-host shared-Gateway role. Platinum renders the shared edge only; per-host Certificate, ListenerSet, and HTTPRoute belong to the exposure materializer.
devHost:
  enabled: false
  # @schema pattern:^[a-z0-9-]+$
  # -- Namespace label (under labelPrefix, value "true") that admits a namespace's ListenerSets.
  listenerSetNamespaceLabel: managed-vcluster
  # -- Emergency-only direct listeners on the shared Gateway. They count against the Gateway listener ceiling that ListenerSet avoids.
  emergencyListeners:
    enabled: false
    listeners: [] # @schema item:object

# -- Registered-fleet wildcard Certificates against zinc's DNS-01 ClusterIssuer. Platinum renders no issuer.
registeredCertificates:
  enabled: true
  issuerRef:
    kind: ClusterIssuer # @schema enum:[ClusterIssuer]
    # -- ClusterIssuer instantiated per cluster by charts/zinc.
    name: zinc-letsencrypt
  primary:
    # @schema pattern:^\*\.[a-z0-9.-]+$
    domain: '*.cluster.atomi.cloud'
  backup:
    # @schema pattern:^\*\.[a-z0-9.-]+$
    # -- Route53 backup base domain wildcard (tokenize before live use).
    domain: '*.cluster.atomi-backup.invalid'

# -- kgateway control plane (pinned). Its labels must equal the LPSM set.
upstream:
  enabled: true
  fullnameOverride: platinum-gateway # @schema pattern:^[a-z0-9]+-[a-z0-9]+$
  commonLabels: # @schema additionalProperties:true
    atomi.cloud/platform: sulfoxide
    atomi.cloud/service: platinum
    atomi.cloud/module: gateway
    atomi.cloud/layer: '1'
  image:
    registry: cr.kgateway.dev/kgateway-dev
    tag: v2.5.0
  controller:
    image:
      repository: kgateway
      tag: v2.5.0
    podAnnotations:
      reloader.stakater.com/auto: 'true'
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10101
      runAsGroup: 10101
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi

# -- kgateway CRDs (pinned). Installed once per cluster as its own release before platinum.
crds:
  enabled: false
