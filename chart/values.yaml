# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: metrics
  # @schema pattern:^[a-z0-9]+$;required:true
  service: xenon
  # @schema pattern:^[a-z0-9]+$;required:true
  module: metrics
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# @schema type:boolean;required:true
# -- The declared fact the toggle derives from: true when the cluster already serves `v1beta1.metrics.k8s.io` (k3s bundles
# metrics-server). Then `upstream.enabled` must be false; otherwise it must be true.
builtInMetricsProvider: false

# -- metrics-server 3.13.1 (app 0.8.1, Kubernetes 1.31+) values: upstream defaults plus the toggle, LPSM labels, Reloader,
# pod non-root and limits. No ServiceMonitor, no metrics endpoint (upstream defaults stay off).
upstream:
  # -- The xenon toggle (Helm dependency condition). ON exactly when `builtInMetricsProvider` is false.
  enabled: true
  # -- Conforming `<service>-<token>` name for every upstream object.
  fullnameOverride: xenon-metrics
  # -- Standard `app.kubernetes.io/name` (and selector) value; the `upstream` alias would leak in otherwise.
  nameOverride: metrics-server
  commonLabels:
    atomi.cloud/platform: metrics
    atomi.cloud/service: xenon
    atomi.cloud/module: metrics
    atomi.cloud/layer: '1'
  podLabels:
    atomi.cloud/platform: metrics
    atomi.cloud/service: xenon
    atomi.cloud/module: metrics
    atomi.cloud/layer: '1'
  deploymentAnnotations:
    reloader.stakater.com/auto: 'true'
  podSecurityContext:
    runAsNonRoot: true
  resources:
    requests: { cpu: 100m, memory: 200Mi }
    limits: { cpu: 500m, memory: 400Mi }
