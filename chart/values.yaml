# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label and annotation.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: secrets
  # @schema pattern:^[a-z0-9]+$;required:true
  service: cobalt
  # @schema pattern:^[a-z0-9]+$;required:true
  module: sos
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# @schema additionalProperties:false
# -- The `infisical` ClusterSecretStore: SoS project, environment = serviceTree.landscape, pull-only.
store:
  # @schema pattern:^[a-z0-9]([-a-z0-9]*[a-z0-9])?$;required:true
  name: infisical
  # @schema pattern:^https://[a-z0-9.-]+$;required:true
  hostAPI: https://secrets.atomi.cloud
  # @schema pattern:^[a-z0-9-]+$;required:true
  project: sos
  # @schema additionalProperties:false
  # -- SoS bootstrap credential, written into the cluster by T3 provisioning. References only.
  credentials:
    # @schema pattern:^[a-z0-9]([-a-z0-9]*[a-z0-9])?$;required:true
    secretName: cobalt-sos-bootstrap
    # @schema pattern:^[a-z0-9]([-a-z0-9]*[a-z0-9])?$;required:true
    namespace: secrets
    # @schema pattern:^[A-Za-z0-9._-]+$;required:true
    clientIdKey: clientId
    # @schema pattern:^[A-Za-z0-9._-]+$;required:true
    clientSecretKey: clientSecret

# -- external-secrets 2.7.0 values: upstream defaults plus LPSM labels, Reloader, pod non-root and limits.
upstream:
  fullnameOverride: cobalt-eso
  commonLabels:
    atomi.cloud/platform: secrets
    atomi.cloud/service: cobalt
    atomi.cloud/module: sos
    atomi.cloud/layer: '1'
  global:
    podAnnotations:
      reloader.stakater.com/auto: 'true'
  podSecurityContext:
    runAsNonRoot: true
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  webhook:
    podSecurityContext:
      runAsNonRoot: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 250m, memory: 128Mi }
  certController:
    podSecurityContext:
      runAsNonRoot: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 250m, memory: 128Mi }
