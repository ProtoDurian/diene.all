# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Prefix used by every service-tree label.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: reloader
  # @schema pattern:^[a-z0-9]+$;required:true
  service: chlorine
  # @schema pattern:^[a-z0-9]+$;required:true
  module: reloader
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# -- stakater/reloader overrides: annotation opt-in (never auto-reload-all), LPSM labels, self opt-in, hardening, limits.
upstream:
  nameOverride: reloader
  fullnameOverride: chlorine-reloader
  reloader:
    autoReloadAll: false
    readOnlyRootFileSystem: true
    deployment:
      labels: &lpsm
        atomi.cloud/platform: reloader
        atomi.cloud/service: chlorine
        atomi.cloud/module: reloader
        atomi.cloud/layer: '1'
      annotations:
        reloader.stakater.com/auto: 'true'
      containerSecurityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 128Mi }
    serviceAccount:
      labels: *lpsm
    rbac:
      labels: *lpsm
