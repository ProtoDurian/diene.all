schemaVersion: 1
checks:
  action-pins:
    trustedPattern: ^(AtomiCloud|ProtoDurian|actions)/
    workflowsDir: .github/workflows
  exec-bits:
    globs:
      - '*.sh'
  ci-wiring:
    workflowsDir: .github/workflows
    entrypointPattern: scripts/ci/[A-Za-z0-9._-]+[.]sh
    orchestrators:
      - .github/workflows/ci.yaml
      - .github/workflows/cd.yaml
      - .github/workflows/release.yaml
  toolchain-smoke:
    shell: default
    binaries:
      - actionlint
      - bash
      - cyanprint
      - dlint
      - docker
      - dpkg
      - gh
      - git
      - go version
      - gomplate
      - goreleaser
      - hadolint
      - infisical
      - jq
      - k3d
      - kubectl version --client
      - nix
      - pre-commit
      - releaser
      - rg
      - rpm
      - shellcheck
      - skopeo
      - task
      - treefmt
      - yq
  no-custom-derivations:
    paths:
      - nix/packages.nix
      - nix/env.nix
      - nix/shells.nix
  release-gating: {}
