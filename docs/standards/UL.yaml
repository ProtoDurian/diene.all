namespace: durian.cloud/engineering/standards
premise: Words every standard uses about this template and how it is inherited
language:
  workspace:
    desc: This template, the base every descendant inherits; it names no runtime.
    see: [descendant]
  descendant:
    aliases: [downstream]
    desc: A repository or template built from this one; it adds its own parts, such as images, charts and language setup.
    see: [workspace, strip]
  strip:
    desc: A descendant variant that removes one part of this template; each part stays self-contained so a strip takes out only its own.
    see: [descendant]
  gate:
    desc: A check that refuses a change; hooks in nix/pre-commit.nix are gates, and local commits, task lint and CI run the same ones.
  vendored skills:
    desc: Skills in .claude/skills/vendor/, written only by skills-sync and never by hand.
    see: [workspace]
