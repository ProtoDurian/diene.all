namespace: durian.cloud/engineering/standards/nix
premise: How the nix folder composes packages, shells, formatters and hooks
language:
  nix registry:
    aliases: [registry]
    desc: The source of tools and builders; nix/packages.nix consumes a package by name and never builds one.
    see: [environment group]
  environment group:
    aliases: [group]
    desc: A named list of packages in nix/env.nix that shells compose with ++.
    see: [shell, nix registry]
  shell:
    desc: A named development environment in nix/shells.nix, built from environment groups and entered with nix develop .#name.
    see: [environment group, shellHook]
  shellHook:
    desc: The hook installer a shell inherits so git hooks are installed; never customize or override it in nix/shells.nix.
    see: [shell]
  PATH_add:
    desc: A line in .envrc that adds a path whose existence a repo file declares; never used to install tools or export variables.
