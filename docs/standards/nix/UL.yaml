namespace: durian.cloud/engineering/standards/nix
premise: How the nix folder composes packages, shells, formatters and hooks
language:
  nix registry:
    aliases: [registry]
    desc: Where a package that needs building belongs; this tree consumes it by name in nix/packages.nix and never builds one.
    see: [environment group]
  environment group:
    aliases: [group]
    desc: A named list of packages in nix/env.nix that shells compose with ++.
    see: [shell, nix registry]
  shell:
    desc: A named development environment in nix/shells.nix, built from environment groups and entered with nix develop .#name.
    see: [environment group, shellHook]
  shellHook:
    desc: Passed to a shell that runs the git hooks, which inherits it; never customize or override it in nix/shells.nix.
    see: [shell]
  PATH_add:
    desc: A .envrc line for a path whose existence a file checked into the repository declares; a dev convenience.
