namespace: durian.cloud/engineering/standards/semantic-release
premise: How releases are configured, triggered and published from one file
language:
  release.yaml:
    desc: The single source of truth for commit types, release levels, message rules, the conventions document and how a release commits and publishes.
    see: [releaser, conventions document]
  releaser:
    desc: The registry tool that reads release.yaml to lint commits, calculate versions, write the changelog and publish a release.
    see: [release.yaml]
  conventions document:
    desc: docs/developer/CommitConventions.md, generated by the releaser from release.yaml; regenerate it, never edit it by hand.
    see: [release.yaml]
  release.commit.assets:
    desc: The files a release commits; the releaser aborts if a write lands outside the list, and a file listed but never written is dead configuration.
    see: [release.yaml]
  release.hooks.prepare:
    desc: Deliberately empty here; a list of phase and command entries a downstream node fills, usually to stamp the version into a file.
    see: [release.commit.assets]
