# Label key prefix. Set by scripts/local/helm-check.sh from the root chart's labelPrefix (infra/root_chart/values.yaml), the one place it is configured.
labelPrefix: ""

# The one named exception to the label rules: the Alloy operator's own objects, which its chart cannot label.
# Exact kind and name pairs; not a general opt-out.
alloyOperator:
  - kind: Deployment
    name: alloy-operator
  - kind: Job
    name: alloy-operator-crds
