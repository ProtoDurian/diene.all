name: diene_api_engine
description: >-
  Typed OA3 backend-client engine: wraps generated OpenAPI SDKs into
  Result/Problem outcomes, registers N backends, retries once on network
  failure, ships a dormant rescue router.
version: 0.0.0
repository: https://github.com/ProtoDurian/diene.dart_api_engine
issue_tracker: https://github.com/ProtoDurian/diene.dart_api_engine/issues
homepage: https://github.com/ProtoDurian/diene.dart_api_engine

topics:
  - api
  - openapi
  - http
  - result
  - resilience

resolution: workspace

# diene_auth_engine needs the Flutter SDK, so this package does too.
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  collection: ^1.19.1
  diene_auth_engine: ^1.0.2
  # ^0.1.1, never 0.1.0: 0.1.0 was published from rejected content.
  diene_problems: ^0.1.1
  diene_result: ^1.0.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  meta: ^1.18.0
  retrofit: ^4.9.2

# flutter_test pins test_api and matcher, so neither test nor pana can join.
dev_dependencies:
  crypto: ^3.0.6
  dart_code_linter: ^4.1.8
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
