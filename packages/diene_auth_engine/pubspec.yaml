name: diene_auth_engine
description: Logto auth flows, per-resource tokens, claims-first per-backend onboarding, deferred login, and Doc B landscape selection for Flutter applications.
version: 0.0.0
repository: https://github.com/ProtoDurian/diene.dart_auth_engine
issue_tracker: https://github.com/ProtoDurian/diene.dart_auth_engine/issues
homepage: https://github.com/ProtoDurian/diene.dart_auth_engine

topics:
  - auth
  - logto
  - oidc
  - onboarding
  - flutter

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  diene_problems: ^0.1.1
  diene_result: ^1.0.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  logto_dart_sdk: ^3.0.0
  meta: ^1.16.0

# flutter_test pins test_api and matcher, so neither test nor pana can join.
dev_dependencies:
  coverage: ^1.15.1
  crypto: ^3.0.6
  dart_code_linter: ^4.1.7
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
