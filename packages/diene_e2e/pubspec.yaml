name: diene_e2e
description: >-
  Test harness for the Diene Dart family: bundles the member test helpers and
  ships stub servers, journey drivers and the app-handoff fixture.
version: 0.0.0
repository: https://github.com/ProtoDurian/diene.dart_e2e
issue_tracker: https://github.com/ProtoDurian/diene.dart_e2e/issues
homepage: https://github.com/ProtoDurian/diene.dart_e2e

topics:
  - testing
  - e2e
  - test-helper
  - fixtures
  - atomicloud

resolution: workspace

# diene_auth_engine and diene_api_engine need the Flutter SDK, so this does too.
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  diene_api_engine: ^1.0.0
  diene_auth_engine: ^1.0.2
  diene_config: ^1.0.0
  diene_core_utils: ^1.0.1
  diene_interfaces: ^1.0.0
  # ^0.1.1, never 0.1.0: 0.1.0 was published from rejected content.
  diene_problems: ^0.1.1
  diene_result: ^1.0.0
  flutter:
    sdk: flutter

# flutter_test pins test_api and matcher, so neither test nor pana can join.
dev_dependencies:
  crypto: ^3.0.6
  dart_code_linter: ^4.1.8
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  lints: ^6.1.0
