schemaVersion: 2

types:
  - type: amend
    desc: Small amendments and typo fixes
    scopes:
      default:
        desc: Amend existing work
        release: false
  - type: build
    desc: Build-system changes
    scopes:
      default:
        desc: Update build machinery
        release: false
  - type: chore
    desc: Repository chores
    scopes:
      default:
        desc: Perform a chore
        release: false
  - type: ci
    desc: CI/CD changes
    scopes:
      default:
        desc: Update CI/CD
        release: false
  - type: config
    desc: Configuration changes
    scopes:
      default:
        desc: Update configuration
        release: false
  - type: dep
    desc: Dependency updates
    section: 🔼 Dependency Upstreams 🔼
    scopes:
      default:
        desc: Update a dependency
        release: false
      patch:
        desc: Patch dependency update
        release: patch
      minor:
        desc: Minor dependency update
        release: minor
      major:
        desc: Major dependency update
        release: major
  - type: docs
    desc: Documentation changes
    section: 📜 Documentation 📜
    scopes:
      default:
        desc: Update documentation
        release: false
  - type: feat
    desc: New features
    section: ✨ Features ✨
    scopes:
      default:
        desc: Add a feature
        release: minor
      breaking:
        desc: Add a breaking feature
        release: major
  - type: fix
    desc: Bug fixes
    section: 🐛 Bug Fixes 🐛
    scopes:
      default:
        desc: Fix a bug
        release: patch
  - type: perf
    desc: Performance improvements
    section: 🚀 Performance Improvement 🚀
    scopes:
      default:
        desc: Improve performance
        release: patch
  - type: refactor
    desc: Refactors
    scopes:
      default:
        desc: Refactor implementation
        release: minor
  - type: style
    desc: Non-functional style changes
    scopes:
      default:
        desc: Update style
        release: patch
  - type: test
    desc: Test changes
    section: 🧪 Tests 🧪
    scopes:
      default:
        desc: Add or correct tests
        release: minor

specialScopes:
  no-release:
    desc: Prevent release from happening
    release: false

keywords:
  - BREAKING CHANGE
  - BREAKING CHANGES
  - BREAKING

lint:
  header:
    maxLength: 72
    minLength: 5
    forbiddenWords:
      - WIP
    forbidTrailingPunctuation: true
  body:
    maxLineLength: 80
    minLengthWhenPresent: 20
    requireBlankSecondLine: true
  ignore:
    - merge
    - revert
    - fixup
    - fixup-amend
    - squash

# The config requires this block and the generator always writes scope tables, so
# its output goes to an ignored file; docs/developer/CommitConventions.md is hand-written.
conventions:
  path: .releaser/conventions.md
  template: CONVENTION_DOCS_PLACEHOLDER

release:
  branches:
    - main
  tagFormat: 'v${version}'
  changelog:
    path: Changelog.md
    title: '# Changelog'
  commit:
    message: |-
      release: ${version}

      ${notes}
    assets:
      - Changelog.md
  github:
    enabled: true
    successComment: 'Released in ${version}.'
    releasedLabels:
      - released
  hooks:
    # A file a hook writes joins commit.assets in the same edit.
    prepare: []
    success: []
