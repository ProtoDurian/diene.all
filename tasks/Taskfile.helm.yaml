version: '3'

# One task set and vars block per chart; never re-point a shared chart variable.
tasks:
  root_chart:deps:
    desc: Build dependencies for infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - helm dependency build {{.CHART}}

  root_chart:lint:
    desc: Lint infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - helm lint {{.CHART}}

  root_chart:template:
    desc: Render infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - helm template diene-workspace {{.CHART}} {{.CLI_ARGS}}

  root_chart:debug:
    desc: Render infra/root_chart with debug output
    vars:
      CHART: infra/root_chart
    cmds:
      - helm template diene-workspace {{.CHART}} --debug {{.CLI_ARGS}}

  root_chart:render:
    desc: Render (gitignored) plain YAML for infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - ./scripts/local/helm-render.sh {{.CHART}}

  root_chart:check:
    desc: Render, then run kubeconform and kyverno (VAP) on infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - ./scripts/local/helm-check.sh {{.CHART}}
