version: '3'
vars:
  MODE: '{{.MODE | default "unit"}}'
  CONFIG: '{{.CONFIG | default "bunfig.unit.toml"}}'
  TIMEOUT: '{{.TIMEOUT | default "30000"}}'
tasks:
  default:
    internal: true
    desc: 'Run {{.MODE}} tests'
    cmds:
      - bun test --config={{.CONFIG}} --timeout {{.TIMEOUT}}
  coverage:
    internal: true
    desc: 'Run {{.MODE}} tests with coverage (lcov + text artifacts)'
    cmds:
      - bun test --config={{.CONFIG}} --timeout {{.TIMEOUT}} --coverage
  watch:
    internal: true
    desc: 'Run {{.MODE}} tests in watch mode'
    cmds:
      - bun test --config={{.CONFIG}} --timeout {{.TIMEOUT}} --watch
