version: '3'
vars:
  MODE: '{{.MODE | default "unit"}}'
  CONFIG: '{{.CONFIG | default "bunfig.unit.toml"}}'
tasks:
  default:
    internal: true
    desc: 'Run {{.MODE}} tests'
    cmds:
      - |
        if [ "{{.MODE}}" = "meta" ]; then
          ./scripts/local/test-meta.sh "{{.CONFIG}}"
        elif [ "{{.MODE}}" = "int" ]; then
          ./scripts/ci/test.sh int
        else
          bun test --config={{.CONFIG}}
        fi
  coverage:
    internal: true
    desc: 'Run {{.MODE}} tests with coverage (lcov + text artifacts)'
    cmds:
      - |
        if [ "{{.MODE}}" = "meta" ]; then
          ./scripts/local/test-meta.sh "{{.CONFIG}}" coverage
        elif [ "{{.MODE}}" = "int" ]; then
          ./scripts/ci/test.sh int
        else
          bun test --config={{.CONFIG}} --coverage
        fi
  watch:
    internal: true
    desc: 'Run {{.MODE}} tests in watch mode'
    cmds:
      - bun test --config={{.CONFIG}} --watch
