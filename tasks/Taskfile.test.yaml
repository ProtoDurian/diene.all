version: '3'

tasks:
  unit:
    desc: Run the unit tier
    cmds:
      - ./scripts/local/test.sh unit {{.CLI_ARGS}}

  int:
    desc: Run the integration tier
    cmds:
      - ./scripts/local/test.sh int {{.CLI_ARGS}}

  meta:
    desc: Run the meta tier
    cmds:
      - ./scripts/local/test.sh meta {{.CLI_ARGS}}

  sit:
    desc: Run the SIT tier through the freshly compiled binary
    deps: [':compile']
    cmds:
      - SIT_DRIVER=binary CLI_BIN=dist/bin/{{.ARTIFACT}} ./scripts/local/test.sh sit {{.CLI_ARGS}}
