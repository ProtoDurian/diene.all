# Stand-ins for vcluster-synced workloads; services are applied by the test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-a
  namespace: entei-fixture
spec:
  selector:
    matchLabels:
      app: fixture-a
  template:
    metadata:
      labels:
        app: fixture-a
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: [netexec, --http-port=8080]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-b
  namespace: entei-fixture
spec:
  selector:
    matchLabels:
      app: fixture-b
  template:
    metadata:
      labels:
        app: fixture-b
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: [netexec, --http-port=8080]
          ports:
            - containerPort: 8080
