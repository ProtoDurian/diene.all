apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fixture-selfsigned
  namespace: entei-fixture
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fixture-ca
  namespace: entei-fixture
spec:
  isCA: true
  commonName: platinum fixture CA
  secretName: fixture-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fixture-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fixture-ca
  namespace: entei-fixture
spec:
  ca:
    secretName: fixture-ca
