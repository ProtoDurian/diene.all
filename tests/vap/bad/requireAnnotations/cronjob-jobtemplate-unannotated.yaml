apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-report-unannotated
  namespace: sample
  labels:
    atomi.cloud/landscape: example
    atomi.cloud/platform: sample
    atomi.cloud/service: demo
    atomi.cloud/module: api
    atomi.cloud/layer: '2'
  annotations:
    atomi.cloud/landscape: example
    atomi.cloud/platform: sample
    atomi.cloud/service: demo
    atomi.cloud/module: api
    atomi.cloud/layer: '2'
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: demo-api
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
          initContainers:
            - name: init
              image: docker.io/library/busybox:1.37.0
              command: ['true']
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 50m, memory: 32Mi }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
          containers:
            - name: api
              image: ghcr.io/stefanprodan/podinfo:6.9.2
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 50m, memory: 32Mi }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
          volumes:
            - name: config
              configMap: { name: demo-config }
            - name: scratch
              emptyDir: {}
          restartPolicy: Never
    metadata:
      labels:
        atomi.cloud/landscape: example
        atomi.cloud/platform: sample
        atomi.cloud/service: demo
        atomi.cloud/module: api
        atomi.cloud/layer: '2'
