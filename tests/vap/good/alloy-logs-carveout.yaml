apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aluminium-alloy-logs
  namespace: telemetry
  labels:
    atomi.cloud/landscape: example
    atomi.cloud/platform: telemetry
    atomi.cloud/service: aluminium
    atomi.cloud/module: telemetry
    atomi.cloud/layer: '1'
  annotations:
    atomi.cloud/landscape: example
    atomi.cloud/platform: telemetry
    atomi.cloud/service: aluminium
    atomi.cloud/module: telemetry
    atomi.cloud/layer: '1'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
      initContainers:
        - name: init
          image: docker.io/library/busybox:1.37.0
          command: ['true']
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: config
          configMap: { name: demo-config }
        - name: scratch
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
      serviceAccountName: aluminium-alloy-logs
