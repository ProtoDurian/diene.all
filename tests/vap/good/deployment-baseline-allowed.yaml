apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-hardened
  namespace: sample
  labels:
    atomi.cloud/landscape: example
    atomi.cloud/platform: sample
    atomi.cloud/service: demo
    atomi.cloud/module: api
    atomi.cloud/layer: '2'
  annotations:
    atomi.cloud/landscape: example
    atomi.cloud/platform: sample
    atomi.cloud/service: demo
    atomi.cloud/module: api
    atomi.cloud/layer: '2'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: '0'
      initContainers:
        - name: init
          image: docker.io/library/busybox:1.37.0
          command: ['true']
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: RuntimeDefault
            seLinuxOptions:
              type: container_t
          ports:
            - containerPort: 9898
      volumes:
        - name: config
          configMap: { name: demo-config }
        - name: scratch
          emptyDir: {}
