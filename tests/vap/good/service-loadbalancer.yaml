apiVersion: v1
kind: Service
metadata:
  name: demo-gateway
  namespace: sample
  labels:
    atomi.cloud/landscape: example
    atomi.cloud/platform: sample
    atomi.cloud/service: demo
    atomi.cloud/module: api
    atomi.cloud/layer: '2'
  annotations:
    atomi.cloud/landscape: example
    atomi.cloud/platform: sample
    atomi.cloud/service: demo
    atomi.cloud/module: api
    atomi.cloud/layer: '2'
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - port: 443
      targetPort: 9898
